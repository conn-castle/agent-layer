name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/bin
            .cache/go-mod
          key: ${{ runner.os }}-go-tools-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-${{ steps.setup-go.outputs.go-version }}-
            ${{ runner.os }}-go-tools-
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
          if ! command -v uvx >/dev/null 2>&1; then
            echo "::error::uvx is required by the pinned benchmark adapter contract."
            exit 1
          fi
      - name: Cache e2e release binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/al-e2e/bin
          key: e2e-binaries-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned tools
        run: make tools
      - name: CI checks
        run: make ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build release artifacts (dry run)
        run: make release-dist AL_VERSION=ci DIST_DIR=dist

  native-muse:
    name: Native Muse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache pinned native Muse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .agent-layer/tmp/muse-native/bin
          key: native-muse-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/test-muse-native/release.json') }}
      - name: Test real Muse with local provider and MCP fixtures
        run: make test-muse-native
      - name: Upload native test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-muse-${{ runner.os }}-${{ runner.arch }}
          include-hidden-files: true
          path: |
            .agent-layer/tmp/muse-native/runs/*/*.json
            .agent-layer/tmp/muse-native/runs/*/*.jsonl
            .agent-layer/tmp/muse-native/runs/*/*.log
            .agent-layer/tmp/muse-native/runs/*/*.txt
            .agent-layer/tmp/muse-native/*/*.json
            .agent-layer/tmp/muse-native/*/*.jsonl
            .agent-layer/tmp/muse-native/*/*.log
            .agent-layer/tmp/muse-native/*/*.txt

  website-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Checkout agent-layer-web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn-castle/agent-layer-web
          ref: main
          path: agent-layer-web
          persist-credentials: false
      - name: Build published website
        run: make website-build-check SITE_BUILD_TAG=v999.0.0 WEBSITE_REPO_DIR=agent-layer-web
