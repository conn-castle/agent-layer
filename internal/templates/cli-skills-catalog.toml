# Internal CLI skill catalog used by `al wizard`.
# This file is embedded in the al binary and never written to a user repo.
# The wizard reads this catalog to populate its CLI skill multiselect.
# Each entry's directory lives under internal/templates/skills-catalog/<id>/.
# To enable a catalog skill, the wizard copies the matching directory into
# `.agent-layer/skills/<id>/`. To disable, the wizard removes that directory.

[[cli_skills]]
id = "tavily-web"
name = "Tavily web search"
binary = "tvly"

[[cli_skills]]
id = "playwright"
name = "Playwright browser automation"
binary = "playwright-cli"

[[cli_skills]]
id = "find-docs"
name = "Context7 docs lookup"
# find-docs invokes `npx ctx7`; the closest deterministic presence check is `npx`.
binary = "npx"

[[cli_skills]]
id = "dispatch-agent"
name = "Agent dispatch (cross agent conversations)"
# dispatch-agent has no external CLI requirement; no binary key.

[[cli_skills]]
id = "skill-sync"
name = "Skill sync (import and update skills from Git)"
ownership_marker = "<!-- agent-layer-catalog-skill: skill-sync -->"
# skill-sync uses the current Agent Layer binary; no external binary key.

[[cli_skills]]
id = "development-skills"
name = "Agent Layer development skills (/implement, /ship-pr, etc.)"
# Grouped catalog entry: members are copied from embedded skills/<id>/,
# not skills-catalog/<id>/. The id itself is not a destination directory.
members = [
  "implement",
  "ship-pr",
  "auto-skill-loop",
  "audit-documentation",
  "audit-memory",
  "audit-tests",
  "interface-audit",
]
