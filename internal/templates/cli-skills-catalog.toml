# Internal catalog shared by wizard, doctor, and release manifests.
# Empty repository entries are embedded; Git entries use exact selectors.

[[cli_skills]]
id = "tavily-web"
repository = "https://github.com/nicholasjconn/skills.git"
selectors = ["skills/tools/tavily-web"]
name = "Tavily web search"
binary = "tvly"

[[cli_skills]]
id = "playwright"
repository = "https://github.com/nicholasjconn/skills.git"
selectors = ["skills/tools/playwright"]
name = "Playwright browser automation"
binary = "playwright-cli"

[[cli_skills]]
id = "find-docs"
repository = "https://github.com/nicholasjconn/skills.git"
selectors = ["skills/tools/find-docs"]
name = "Context7 docs lookup"
# find-docs invokes `npx ctx7`; the closest deterministic presence check is `npx`.
binary = "npx"

[[cli_skills]]
id = "dispatch-agent"
name = "Agent dispatch (cross agent conversations)"
# dispatch-agent has no external CLI requirement; no binary key.

[[cli_skills]]
id = "skill-sync"
name = "Skill sync (import and update skills from Git)"
ownership_marker = "<!-- agent-layer-catalog-skill: skill-sync -->"
# skill-sync uses the current Agent Layer binary; no external binary key.

[[cli_skills]]
id = "benchmark"
name = "Agent Layer benchmark"
# benchmark is a guidance skill; no external binary key.

[[cli_skills]]
id = "development-skills"
name = "Development skills (/implement, /ship-pr, etc.)"
repository = "https://github.com/nicholasjconn/skills.git"
selectors = ["skills/development/implement", "skills/development/ship-pr", "skills/development/auto-skill-loop", "skills/development/audit-documentation", "skills/development/audit-memory", "skills/development/audit-tests", "skills/development/interface-audit"]
# Grouped Git import: selectors are exact paths; id is only a checkbox identity.
