# Canonical agent-facing MCP tool and parameter descriptions.
# Keep this file concise: every enabled caller carries these schemas in context.
# `{{wait_minutes}}` is replaced with the configured wait duration.

[tools.dispatch_options]
description = "List configured providers and their model and reasoning-effort rules."

[tools.dispatch_start]
description = "Start one asynchronous dispatch. Returns its conversation handle and running state."

[tools.dispatch_start.parameters]
agent = "Provider to dispatch: codex, claude, antigravity, or grok."
model = "Optional model override; resolve against dispatch_options."
reasoning_effort = "Optional reasoning-effort override; resolve against dispatch_options."
role = "Optional caller-defined workflow role retained as dispatch evidence."
skill = "Optional skill the dispatched agent must run."
prompt = "Prompt text. Provide exactly one of prompt or prompt_file."
prompt_file = "Path to a prompt file. Provide exactly one of prompt or prompt_file."

[tools.dispatch_wait]
description = "Wait up to {{wait_minutes}} minutes for one conversation. Returns running with recorded last_activity_at/last_output_at timestamps when available; completed returns result_path for the Markdown output, failed returns error, and cancelled is terminal. Ending this wait does not stop provider work."

[tools.dispatch_wait.parameters]
handle = "Conversation handle returned by dispatch_start or dispatch_continue."

[tools.dispatch_continue]
description = "Start the next invocation in one terminal conversation. Returns the same handle and running state."

[tools.dispatch_continue.parameters]
handle = "Terminal conversation handle."
prompt = "Prompt text. Provide exactly one of prompt or prompt_file."
prompt_file = "Path to a prompt file. Provide exactly one of prompt or prompt_file."

[tools.dispatch_cancel]
description = "Permanently stop active provider work for one conversation. Returns its handle and cancelled state."

[tools.dispatch_cancel.parameters]
handle = "Active conversation handle."
