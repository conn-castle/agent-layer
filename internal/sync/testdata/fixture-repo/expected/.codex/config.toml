[mcp_servers."agent-layer"]
command = "/bin/sh"
args = ["-c", "AL_MCP_WORKING_DIR=$PWD; export AL_MCP_WORKING_DIR; cd \"$1\" && exec al dispatch mcp-server", "agent-layer-mcp", "__REPO_ROOT__"]
tool_timeout_sec = 2400

[mcp_servers."example"]
bearer_token_env_var = "AL_EXAMPLE_TOKEN"
url = "https://mcp.example.com?token=token123"
